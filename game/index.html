<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Dawn — Spot the Difference</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <h1 id="gameTitle">Harbour Dawn — Spot the Difference</h1>
      <p id="gameSubtitle">A quiet morning at the old harbour. Ten things changed between the two pictures.</p>
    </div>
    <div class="hud-stats">
      <div class="stat"><span class="stat-label">Found</span><span id="foundCount" class="stat-value">0 / 10</span></div>
      <div class="stat"><span class="stat-label">Score</span><span id="scoreValue" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">Time</span><span id="timeValue" class="stat-value">3:00</span></div>
      <div class="stat"><span class="stat-label">Hints</span><span id="hintValue" class="stat-value">3</span></div>
    </div>
    <div class="hud-buttons">
      <button id="hintButton" type="button" title="Hint (H)">💡 Hint</button>
      <button id="soundButton" type="button" title="Sound on/off">🔊 Sound</button>
      <button id="restartButton" type="button" title="Restart (R)">↻ Restart</button>
    </div>
  </header>
  <div id="timeBarWrap"><div id="timeBar"></div></div>
  <main id="boards">
    <figure class="panel">
      <figcaption>Original</figcaption>
      <canvas id="panelLeft" width="640" height="420" aria-label="Original picture"></canvas>
    </figure>
    <figure class="panel">
      <figcaption>Find the differences</figcaption>
      <canvas id="panelRight" width="640" height="420" aria-label="Changed picture: click the differences"></canvas>
    </figure>
  </main>
  <div id="lens" hidden><canvas id="lensCanvas" width="180" height="180"></canvas></div>
  <p id="messageBar" role="status" aria-live="polite">Click a difference on either picture. Press H for a hint.</p>
  <div id="overlay" hidden>
    <div id="overlayCard">
      <h2 id="overlayTitle"></h2>
      <p id="overlayText"></p>
      <p id="overlayStats"></p>
      <button id="overlayButton" type="button">Play again</button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
